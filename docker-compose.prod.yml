name: benim-depom

x-app-common: &app-common
  image: ghcr.io/automatonsoft/benim-depom-back:${IMAGE_TAG:?Set IMAGE_TAG in .deploy.env}
  restart: unless-stopped
  init: true
  env_file:
    - .env
  environment:
    DJANGO_ENV: production
    CONTACT_JSON_PATH: /app/runtime/contact.json
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    REDIS_CACHE_URL: redis://redis:6379/2
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: &default-logging
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${APP_BIND_PORT:-18081}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/.htpasswd:/etc/nginx/secrets/.htpasswd:ro
      - staticfiles:/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/api/v1/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  web:
    <<: *app-common
    volumes:
      - staticfiles:/app/staticfiles
      - runtime-data:/app/runtime
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/api/v1/health/ || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 30s


  worker_marketplace:
    <<: *app-common
    command: >
      celery -A config worker --loglevel=INFO
      --queues=marketplace
      --concurrency=2
      --max-tasks-per-child=500
    stop_grace_period: 60s

  worker_ai:
    <<: *app-common
    command: >
      celery -A config worker --loglevel=INFO
      --queues=ai
      --concurrency=2
      --max-tasks-per-child=200
    stop_grace_period: 60s

  worker_images:
    <<: *app-common
    command: >
      celery -A config worker --loglevel=INFO
      --queues=images
      --concurrency=2
      --max-tasks-per-child=200
    stop_grace_period: 60s

  worker_notifications:
    <<: *app-common
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    command: >
      celery -A config worker --loglevel=INFO
      --queues=notifications
      --concurrency=2
      --max-tasks-per-child=500
    stop_grace_period: 60s

  worker_maintenance:
    <<: *app-common
    command: >
      celery -A config worker --loglevel=INFO
      --queues=maintenance
      --concurrency=1
      --max-tasks-per-child=500
    stop_grace_period: 60s

  beat:
    <<: *app-common
    command: celery -A config beat --loglevel=INFO
    stop_grace_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --save
      - "60 10000"
      - --stop-writes-on-bgsave-error
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  runtime-data:


