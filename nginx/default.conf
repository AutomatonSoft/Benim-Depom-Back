upstream django_backend {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 512m;

    location ^~ /static/ {
        alias /staticfiles/;
        access_log off;
        expires 30d;
    }

    location ~ ^/api/(docs|scalar|schema)/?$ {
        auth_basic "Benim Depom API documentation";
        auth_basic_user_file /etc/nginx/secrets/.htpasswd;

        proxy_pass http://django_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
    }

    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;

        error_page 413 = @api_413;
        error_page 502 = @api_502;
        error_page 503 = @api_503;
        error_page 504 = @api_504;
    }

    location @api_413 {
        default_type application/json;
        return 413 '{"detail":"Request body too large."}';
    }

    location @api_502 {
        default_type application/json;
        return 502 '{"detail":"Bad gateway."}';
    }

    location @api_503 {
        default_type application/json;
        return 503 '{"detail":"Service unavailable."}';
    }

    location @api_504 {
        default_type application/json;
        return 504 '{"detail":"Gateway timeout."}';
    }

    location / {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
    }
}



