x-worker-common: &worker-common
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
  volumes:
    - .:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_CACHE_URL: redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker_marketplace:
    <<: *worker-common
    command: >
      celery -A config worker --loglevel=INFO
      --queues=marketplace
      --concurrency=2
      --max-tasks-per-child=500

  worker_ai:
    <<: *worker-common
    command: >
      celery -A config worker --loglevel=INFO
      --queues=ai
      --concurrency=2
      --max-tasks-per-child=200

  worker_images:
    <<: *worker-common
    command: >
      celery -A config worker --loglevel=INFO
      --queues=images
      --concurrency=2
      --max-tasks-per-child=200

  worker_notifications:
    <<: *worker-common
    command: >
      celery -A config worker --loglevel=INFO
      --queues=notifications
      --concurrency=2
      --max-tasks-per-child=500
      

  worker_maintenance:
    <<: *worker-common
    command: >
      celery -A config worker --loglevel=INFO
      --queues=maintenance
      --concurrency=1
      --max-tasks-per-child=500

  beat:
    build: .
    command: celery -A config beat --loglevel=INFO
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --save
      - "60 10000"
      - --stop-writes-on-bgsave-error
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
