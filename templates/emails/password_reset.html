<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Password reset — Benim Depom</title></head>
<body style="margin:0;padding:24px 12px;background-color:#eef2f7;font-family:Arial,Helvetica,sans-serif;color:#173968;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background-color:#ffffff;border:1px solid #e4eaf2;border-radius:16px;">
    <tr><td style="padding:24px 28px;background-color:#173968;border-radius:16px 16px 0 0;">
      <p style="margin:0 0 10px;color:#f7941d;font-size:12px;font-weight:bold;letter-spacing:1px;">BENIM DEPOM</p>
      <h1 style="margin:0;color:#ffffff;font-size:24px;line-height:1.3;">Reset your password</h1>
    </td></tr>
    <tr><td style="padding:28px;">
      {% if username %}
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fff6eb;border:1px solid #ffe0b8;border-radius:12px;">
        <tr><td style="padding:18px 20px;">
          <p style="margin:0 0 8px;color:#5b6b82;font-size:12px;">Account</p>
          <p style="margin:0;font-size:20px;line-height:1.4;font-weight:bold;overflow-wrap:anywhere;word-break:break-word;">{{ username }}</p>
        </td></tr>
      </table>
      {% endif %}
      <p style="margin:24px 0 16px;color:#5b6b82;font-size:15px;line-height:1.6;">Enter this code to reset your Benim Depom password:</p>
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f7f9fc;border:1px solid #e4eaf2;border-radius:12px;">
        <tr><td align="center" style="padding:22px 16px;font-size:34px;line-height:1.2;font-weight:bold;letter-spacing:6px;">{{ code }}</td></tr>
      </table>
      <p style="margin:20px 0 0;color:#5b6b82;font-size:13px;line-height:1.6;">This code expires in {{ minutes }} minutes. Do not share it with anyone.</p>
    </td></tr>
    <tr><td style="padding:0 28px 24px;">
      <p style="margin:0;padding-top:18px;border-top:1px solid #e4eaf2;color:#5b6b82;font-size:12px;line-height:1.6;">If you did not request a password reset, you can ignore this email.</p>
    </td></tr>
  </table>
</body>
</html>
