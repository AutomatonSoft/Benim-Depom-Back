[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "**/migrations/*.py",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.ruff.lint.per-file-ignores]
"config/settings/local.py" = ["F403", "F405"]
"config/settings/production.py" = ["F403", "F405"]
"config/settings/test.py" = ["F403", "F405"]